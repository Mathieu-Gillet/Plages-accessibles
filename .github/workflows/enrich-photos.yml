name: Enrichissement des photos Wikimedia

on:
  schedule:
    # 08:00 UTC — décalé après import (06:00) et enrich-pois (07:00) pour ne pas
    # tourner en parallèle sur la même base.
    - cron: '0 8 * * *'
  workflow_dispatch:  # Bouton de déclenchement manuel dans l'onglet Actions.

permissions:
  contents: write  # Required to push the updated photos directly to master.

# Autonomous pipeline: validates the content itself, then commits straight to
# master. Shares the `content-master` concurrency group with import & enrich so
# the pipelines never push to master at the same time.
concurrency:
  group: content-master
  cancel-in-progress: false

jobs:
  enrich-photos:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history so `git pull --rebase` before push works

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run photo enrichment script
        run: npx tsx scripts/enrich-photos.ts

      - name: Detect changes
        id: diff
        run: |
          if git diff --quiet -- content/plages/; then
            echo "changed=0" >> "$GITHUB_OUTPUT"
            echo "Aucune photo mise à jour — rien à publier."
          else
            echo "changed=1" >> "$GITHUB_OUTPUT"
          fi

      # Safety net: validate the freshly written content exactly like CI does.
      - name: Validate (lint, types, tests, build)
        if: steps.diff.outputs.changed == '1'
        run: |
          npm run lint
          npx tsc --noEmit
          npm test
          npm run build

      - name: Commit & push to master
        if: steps.diff.outputs.changed == '1'
        run: |
          git config user.name "plages-photos-bot"
          git config user.email "actions@users.noreply.github.com"
          git add content/plages/
          git commit -m "auto: enrichissement photos Wikimedia — $(date -u +%Y-%m-%d)"
          git pull --rebase origin master
          git push origin HEAD:master
