name: Réécriture IA des descriptions templatisées

on:
  schedule:
    # 09:00 UTC — décalé après import (06:00), enrich-pois (07:00) et
    # enrich-photos (08:00) pour ne pas tourner en parallèle sur la même base.
    - cron: '0 9 * * *'
  workflow_dispatch:  # Bouton de déclenchement manuel dans l'onglet Actions.

permissions:
  contents: write  # Required to push the rewritten descriptions directly to master.

# Autonomous pipeline: validates the content itself, then commits straight to
# master. Shares the `content-master` concurrency group so the pipelines never
# push to master at the same time.
concurrency:
  group: content-master
  cancel-in-progress: false

jobs:
  enrich-descriptions:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history so `git pull --rebase` before push works

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run description rewrite script
        id: rewrite
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npx tsx scripts/enrich-descriptions.ts

      - name: Nothing rewritten — stop here
        if: steps.rewrite.outputs.rewritten == '0'
        run: echo "Aucune description templatisée réécrite aujourd'hui — rien à publier."

      # Safety net: validate the freshly written content exactly like CI does.
      - name: Validate (lint, types, tests, build)
        if: steps.rewrite.outputs.rewritten != '0'
        run: |
          npm run lint
          npx tsc --noEmit
          npm test
          npm run build

      - name: Commit & push to master
        if: steps.rewrite.outputs.rewritten != '0'
        run: |
          git config user.name "plages-descriptions-bot"
          git config user.email "actions@users.noreply.github.com"
          git add content/plages/
          git commit -m "auto: réécriture IA de ${{ steps.rewrite.outputs.rewritten }} description(s) — $(date -u +%Y-%m-%d)"
          git pull --rebase origin master
          git push origin HEAD:master
