name: Import quotidien des plages

on:
  schedule:
    # 06:00 UTC = 08:00 Paris été / 07:00 Paris hiver.
    # GitHub Actions schedules can drift by 5–15 min during peak load.
    - cron: '0 6 * * *'
  workflow_dispatch:  # Manual trigger button in the Actions tab — useful for testing.

permissions:
  contents: write  # Required to push the new beaches directly to master.

# Autonomous pipeline: the import job validates the new content itself (same gates
# as the CI workflow) and, if green, commits straight to master — no PR, no
# auto/* branch, no human review step. Vercel rebuilds on the push. Serialised
# with the enrich workflow so the two never push to master at the same time.
concurrency:
  group: content-master
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    # Cap the job so a hung Overpass/scraper request can't burn Actions minutes.
    # Higher than before because the validation build now runs in the same job.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history so `git pull --rebase` before push works

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run import script
        id: import
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ACCESLIBRE_API_KEY: ${{ secrets.ACCESLIBRE_API_KEY }}
          DATATOURISME_API_KEY: ${{ secrets.DATATOURISME_API_KEY }}
        run: npx tsx scripts/import-plages.ts

      - name: Nothing new — stop here
        if: steps.import.outputs.added == '0'
        run: echo "Aucune nouvelle plage qualifiée aujourd'hui — rien à publier."

      # Safety net: validate the freshly written content exactly like CI does.
      # `npm run build` runs every content/plages/*.json through the Zod schema,
      # so a malformed beach fails HERE and never reaches master.
      - name: Validate (lint, types, tests, build)
        if: steps.import.outputs.added != '0'
        run: |
          npm run lint
          npx tsc --noEmit
          npm test
          npm run build

      - name: Commit & push to master
        if: steps.import.outputs.added != '0'
        run: |
          git config user.name "plages-import-bot"
          git config user.email "actions@users.noreply.github.com"
          git add content/plages/
          git commit -m "auto: ${{ steps.import.outputs.added }} nouvelles plages — $(date -u +%Y-%m-%d)"
          # Rebase on any change that landed on master during the run (e.g. a
          # public contribution merged via CI), then push.
          git pull --rebase origin master
          git push origin HEAD:master
