name: Enrichissement quotidien des POIs accessibles

on:
  schedule:
    # 07:00 UTC — décalé d'1 h après l'import (06:00) pour ne pas tourner en
    # parallèle sur la même base, et pour éviter deux salves de requêtes
    # Overpass simultanées.
    - cron: '0 7 * * *'
  workflow_dispatch:  # Bouton de déclenchement manuel dans l'onglet Actions.

permissions:
  contents: write  # Required to push the enriched beaches directly to master.

# Autonomous pipeline: validates the enriched content itself, then commits
# straight to master — no PR, no auto/* branch, no human review step. Shares the
# `content-master` concurrency group with the import workflow so the two never
# push to master at the same time.
concurrency:
  group: content-master
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history so `git pull --rebase` before push works

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run enrichment script
        id: enrich
        run: npx tsx scripts/enrich-pois.ts

      - name: Nothing changed — stop here
        if: steps.enrich.outputs.enriched == '0'
        run: echo "Aucune plage enrichie aujourd'hui — rien à publier."

      # Safety net: validate the freshly written content exactly like CI does.
      - name: Validate (lint, types, tests, build)
        if: steps.enrich.outputs.enriched != '0'
        run: |
          npm run lint
          npx tsc --noEmit
          npm test
          npm run build

      - name: Commit & push to master
        if: steps.enrich.outputs.enriched != '0'
        run: |
          git config user.name "plages-enrich-bot"
          git config user.email "actions@users.noreply.github.com"
          git add content/plages/
          git commit -m "auto: enrichissement POIs — +${{ steps.enrich.outputs.hebergements_added }} hébergements, +${{ steps.enrich.outputs.offres_added }} offres culturelles — $(date -u +%Y-%m-%d)"
          git pull --rebase origin master
          git push origin HEAD:master
